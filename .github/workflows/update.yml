name: Update outages

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [snapshot/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: outages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build page from live sources
        run: |
          python3 build.py _site
          echo "outages.castafero.com" > _site/CNAME
          touch _site/.nojekyll
      - name: Save snapshot when the set of active outages changes
        run: |
          cp _site/state.txt snapshot/state.txt
          git add snapshot/state.txt
          git diff --cached --quiet && exit 0
          cp _site/data.json snapshot/data.json
          git add snapshot/data.json
          git config user.name "outages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Outage state changed $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          echo "::warning::snapshot not pushed; deploying anyway"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
